# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        experimental: [ false ]
        monty-storage: [ memory, flatfile, sqlite ]
        mongodb-version: [ "5.0", "6.0", "7.0", "8.0", "9.0" ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t" ]

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up MongoDB ${{ matrix.mongodb-version }}
      env:
        MONGODB_VERSION: ${{ matrix.mongodb-version }}
        MONGODB_CONTAINER: mongodb
        MONGODB_PORT: 27017
      run: |
        options=""
        if [ "$MONGODB_VERSION" = "8.0" ]; then
          # MongoDB 8.0 refuses to start on Linux kernel 6.19 and newer while
          # TCMalloc per-CPU caches are active (SERVER-121912), and the runners
          # use such a kernel. Let glibc own rseq, so TCMalloc does not use
          # per-CPU caches. Remove this when MongoDB 8.0.35 is released.
          options="--env GLIBC_TUNABLES=glibc.pthread.rseq=1"
        fi
        # shellcheck disable=SC2086
        docker run --name "$MONGODB_CONTAINER" --publish "$MONGODB_PORT:27017" \
          $options --detach "mongo:$MONGODB_VERSION"
        for _ in $(seq 1 60); do
          if docker exec "$MONGODB_CONTAINER" mongosh --quiet --eval \
              "db.runCommand({ping: 1}).ok" > /dev/null 2>&1; then
            docker exec "$MONGODB_CONTAINER" mongosh --quiet --eval \
              "const s = db.serverStatus({tcmalloc: 1}); print('MongoDB ' + s.version + ', TCMalloc per-CPU caches: ' + (s.tcmalloc ? s.tcmalloc.usingPerCPUCaches : 'n/a'))"
            exit 0
          fi
          sleep 1
        done
        echo "MongoDB $MONGODB_VERSION did not start"
        exit 1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: uv sync --locked

    - name: Test with pytest (${{ matrix.monty-storage }})
      continue-on-error: ${{ matrix.experimental }}
      run: >
        uv run pytest --storage ${{ matrix.monty-storage }}

    - name: Test with pytest (${{ matrix.monty-storage }} + bson)
      continue-on-error: ${{ matrix.experimental }}
      run: >
        uv run pytest --storage ${{ matrix.monty-storage }} --use-bson

    - name: Lint with Ruff
      run: uv run ruff check .

    - name: Find typos with codespell
      run: uv run codespell

    - name: Run static analysis with bandit
      run: uv run bandit montydb -r

    - name: Show MongoDB logs
      if: failure()
      run: |
        docker ps --all --filter name=mongodb
        docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' mongodb || true
        docker logs --tail 100 mongodb || true
